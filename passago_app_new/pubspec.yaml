name: passago_app
description: PassaGo - A Smart Passenger Distribution and Transportation Information System (driver app).
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

# No third-party packages yet on purpose. The camera/QR scanner and Bluetooth
